<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Famille & Fraîcheur – Mot de passe oublié</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    .login-wrapper {
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--white);
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
      padding: 2.5rem 2rem;
      text-align: center;
    }
    .login-logo { font-size: 3rem; margin-bottom: 0.5rem; }
    .login-title { font-size: 1.4rem; font-weight: 700; color: var(--green); margin-bottom: 0.2rem; }
    .login-subtitle { color: var(--text-light); font-size: 0.95rem; margin-bottom: 2rem; }
    .info-message { background: #e8f5e9; color: var(--green); padding: 0.8rem; border-radius: 8px; margin-bottom: 1rem; display: none; }
    .info-message.show { display: block; }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-logo">🥬</div>
      <h1 class="login-title">Mot de passe oublié</h1>
      <p class="login-subtitle">Entrez votre email pour recevoir un lien de réinitialisation</p>

      <div class="login-error" id="errorMsg"></div>
      <div class="info-message" id="successMsg"></div>

      <form id="forgotForm">
        <div class="input-group">
          <label for="email"><i class="fas fa-envelope"></i> Email</label>
          <input type="email" id="email" name="email" placeholder="votre@email.com" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block mt-2">
          <i class="fas fa-paper-plane"></i> Envoyer le lien
        </button>
      </form>

      <p style="margin-top: 1.5rem; font-size: 0.9rem;">
        <a href="login.html"><i class="fas fa-arrow-left"></i> Retour à la connexion</a>
      </p>
    </div>
  </div>

  <script>
    const API_BASE = '/api';

    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const errorDiv = document.getElementById('errorMsg');
      const successDiv = document.getElementById('successMsg');

      errorDiv.classList.remove('show');
      errorDiv.textContent = '';
      successDiv.classList.remove('show');
      successDiv.textContent = '';

      if (!email) {
        errorDiv.textContent = 'Veuillez saisir votre email.';
        errorDiv.classList.add('show');
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/auth/forgot-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        // Toujours afficher le même message pour ne pas révéler si l'email existe
        successDiv.textContent = data.message || 'Si un compte existe avec cet email, un lien a été envoyé.';
        successDiv.classList.add('show');
        document.getElementById('forgotForm').reset();
      } catch (err) {
        errorDiv.textContent = 'Erreur réseau. Réessayez.';
        errorDiv.classList.add('show');
      }
    });
  </script>
</body>
</html>
