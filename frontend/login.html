<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Famille & Fraîcheur – Connexion</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Font Awesome pour les icônes -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="manifest" href="/manifest.json">
  <style>
    /* Styles spécifiques à la page de login */
    .login-wrapper {
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--white);
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
      padding: 2.5rem 2rem;
      text-align: center;
    }
    .login-logo {
      font-size: 3rem;
      margin-bottom: 0.5rem;
    }
    .login-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--green);
      margin-bottom: 0.2rem;
    }
    .login-subtitle {
      color: var(--text-light);
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }
    .login-error {
      background: #ffebee;
      color: var(--red);
      padding: 0.6rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      display: none;
    }
    .login-error.show { display: block; }
    .forgot-link {
      display: block;
      text-align: right;
      font-size: 0.85rem;
      margin-top: 0.3rem;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-logo">🥬</div>
      <h1 class="login-title">Famille & Fraîcheur</h1>
      <p class="login-subtitle">Produits frais livrés chez vous</p>

      <div class="login-error" id="loginError"></div>

      <form id="loginForm">
        <div class="input-group">
          <label for="email"><i class="fas fa-envelope"></i> Email</label>
          <input type="email" id="email" name="email" placeholder="votre@email.com" required autocomplete="email">
        </div>
        <div class="input-group">
          <label for="password"><i class="fas fa-lock"></i> Mot de passe</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
          <a href="forgot-password.html" class="forgot-link">Mot de passe oublié ?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-block mt-2">
          <i class="fas fa-sign-in-alt"></i> Se connecter
        </button>
      </form>

      <p style="margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-light);">
        Pas encore de compte ? <a href="register.html">Créer un compte</a>
      </p>
    </div>
  </div>

  <script>
    const API_BASE = '/api';

    // Redirige si déjà connecté
    (function checkAuth() {
      const token = localStorage.getItem('token');
      const role = localStorage.getItem('userRole');
      if (token && role) {
        redirectByRole(role);
      }
    })();

    function redirectByRole(role) {
      const pages = { admin: 'admin.html', delivery: 'livreur.html', customer: 'products.html' };
      window.location.href = pages[role] || 'products.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('loginError');

      errorDiv.classList.remove('show');
      errorDiv.textContent = '';

      if (!email || !password) {
        errorDiv.textContent = 'Veuillez remplir tous les champs.';
        errorDiv.classList.add('show');
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Erreur de connexion');
        }

        // Stocker le token et les infos utilisateur
        localStorage.setItem('token', data.token);
        localStorage.setItem('userId', data.user.id);
        localStorage.setItem('userName', data.user.name);
        localStorage.setItem('userRole', data.user.role);

        if (data.user.whatsapp) localStorage.setItem('userWhatsapp', data.user.whatsapp);

        // Redirection selon le rôle
        redirectByRole(data.user.role);

      } catch (err) {
        errorDiv.textContent = err.message;
        errorDiv.classList.add('show');
      }
    });
  </script>
</body>
</html>
