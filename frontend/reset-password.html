<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Famille & Fraîcheur – Réinitialisation</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    .login-wrapper {
      display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 1rem;
    }
    .login-card {
      width: 100%; max-width: 420px; background: var(--white); border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12); padding: 2.5rem 2rem; text-align: center;
    }
    .login-logo { font-size: 3rem; margin-bottom: 0.5rem; }
    .login-title { font-size: 1.4rem; font-weight: 700; color: var(--green); margin-bottom: 0.2rem; }
    .login-subtitle { color: var(--text-light); font-size: 0.95rem; margin-bottom: 2rem; }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-logo">🔐</div>
      <h1 class="login-title">Nouveau mot de passe</h1>
      <p class="login-subtitle">Choisissez un mot de passe sécurisé</p>

      <div class="login-error" id="errorMsg"></div>
      <div class="info-message" id="successMsg">Mot de passe modifié avec succès ! Redirection en cours…</div>

      <form id="resetForm">
        <div class="input-group">
          <label for="password"><i class="fas fa-lock"></i> Nouveau mot de passe</label>
          <input type="password" id="password" name="password" placeholder="Minimum 6 caractères" required minlength="6">
        </div>
        <div class="input-group">
          <label for="confirmPassword"><i class="fas fa-lock"></i> Confirmer</label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Répéter le mot de passe" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary btn-block mt-2">
          <i class="fas fa-save"></i> Réinitialiser
        </button>
      </form>

      <p style="margin-top: 1.5rem; font-size: 0.9rem;">
        <a href="login.html"><i class="fas fa-arrow-left"></i> Retour à la connexion</a>
      </p>
    </div>
  </div>

  <script>
    const API_BASE = '/api';
    // Récupérer le token depuis l'URL
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    // Vérifier la présence du token
    if (!token) {
      document.getElementById('errorMsg').textContent = 'Token de réinitialisation manquant ou invalide.';
      document.getElementById('errorMsg').classList.add('show');
      document.getElementById('resetForm').style.display = 'none';
    }

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const errorDiv = document.getElementById('errorMsg');
      const successDiv = document.getElementById('successMsg');

      errorDiv.classList.remove('show');
      errorDiv.textContent = '';
      successDiv.classList.remove('show');
      successDiv.textContent = '';

      if (password !== confirmPassword) {
        errorDiv.textContent = 'Les mots de passe ne correspondent pas.';
        errorDiv.classList.add('show');
        return;
      }

      if (password.length < 6) {
        errorDiv.textContent = 'Le mot de passe doit comporter au moins 6 caractères.';
        errorDiv.classList.add('show');
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/auth/reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Erreur lors de la réinitialisation.');

        successDiv.textContent = 'Mot de passe réinitialisé avec succès ! Redirection vers la connexion…';
        successDiv.classList.add('show');
        document.getElementById('resetForm').style.display = 'none';

        // Rediriger après 3 secondes
        setTimeout(() => { window.location.href = 'login.html'; }, 3000);
      } catch (err) {
        errorDiv.textContent = err.message;
        errorDiv.classList.add('show');
      }
    });
  </script>
</body>
</html>
